<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Insight Agent：企业知识洞察与业务决策智能体，将企业资料转化为可执行行动。" />
    <meta name="theme-color" content="#153c34" />
    <link rel="manifest" href="./manifest.json" />
    <title>AI Insight Agent · 企业知识洞察与业务决策智能体</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Vue 3 browser build keeps this MVP free of a frontend build tool. -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="./app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
      }
    </script>
  </body>
</html>
