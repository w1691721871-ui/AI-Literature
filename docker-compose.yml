services:
  backend:
    build: { context: ., dockerfile: Dockerfile.backend }
    env_file: .env
    environment:
      STORAGE_ROOT: /app/work/runtime_storage
      DATABASE_URL: sqlite:////app/work/research_library.db
    volumes: [researchos_state:/app/work]
    ports: ["8000:8000"]
    restart: unless-stopped
  worker:
    build: { context: ., dockerfile: Dockerfile.backend }
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      STORAGE_ROOT: /app/work/runtime_storage
      DATABASE_URL: sqlite:////app/work/research_library.db
    volumes: [researchos_state:/app/work]
    restart: unless-stopped
  frontend:
    build: { context: ., dockerfile: Dockerfile.frontend }
    ports: ["8080:80"]
    depends_on: [backend]
    restart: unless-stopped
  # Optional service boundary for a future external DB adapter. The current
  # runtime remains SQLite-compatible and does not route production traffic here.
  database:
    image: postgres:16-alpine
    profiles: [external-db]
    environment:
      POSTGRES_DB: researchos
      POSTGRES_USER: researchos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_in_environment}
    volumes: [postgres_state:/var/lib/postgresql/data]
volumes:
  researchos_state:
  postgres_state:
