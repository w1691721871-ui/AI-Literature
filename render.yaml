services:
  - type: web
    name: researchos-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/research_library.db
      - key: WORK_DIRECTORY
        value: /var/data
      - key: PYTHON_VERSION
        value: "3.14"
      - key: STORAGE_PROVIDER
        value: LOCAL
      - key: STORAGE_ROOT
        value: /var/data/runtime_storage
      - key: TOKEN_EXPIRE
        value: "43200"
      - key: DEMO_MODE
        value: "true"
      # Configure these deployment secrets in Render before enabling the
      # public Demo. They provision the isolated Demo Owner and Reviewer and
      # are never stored in source or exposed by release endpoints.
      - key: DEMO_OWNER_PASSWORD
        sync: false
      - key: DEMO_REVIEWER_PASSWORD
        sync: false
      - key: REQUIRE_HUMAN_REVIEW
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # A public deployment admits only CORS_ALLOWED_ORIGINS. Local browser
      # access is for isolated development and must remain disabled here.
      - key: RESEARCHOS_ALLOW_LOCAL_CORS
        value: "false"
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: LLM_MODEL
        value: qwen-plus
      - key: EMBEDDING_MODEL
        value: text-embedding-v4
      - key: EMBEDDING_DIMENSIONS
        value: "1024"
      # Set these non-secret values in the managed service before a release.
      # They allow /api/version to prove backend/frontend deployment parity.
      - key: RESEARCHOS_RELEASE
        value: researchos-demo-v200
      # app.main reads Render's built-in RENDER_GIT_COMMIT at runtime. Do not
      # hardcode a commit here: a static value becomes stale after the next deploy.
      - key: RESEARCHOS_FRONTEND_VERSION
        value: v200
      - key: RESEARCHOS_BACKEND_VERSION
        value: api-2026.10
      - key: RESEARCHOS_ENVIRONMENT
        value: demo
